[tools]
rust = { version = "1.98.1", mr_boxington = true }
mr-boxington = "1.18.0"
usage = "6.11.1"
node = "24.20.0"
"npm:oxfmt" = "0.66.0"

[tasks.build]
dir = "{{config_root}}"
run = "cargo build --locked"

[tasks.test]
dir = "{{config_root}}"
run = [
  "cargo test --locked",
  "cargo clippy --locked --all-targets -- -D warnings",
  "node --test scripts/*.test.mjs",
]

[tasks.install]
description = "Build current working files and replace cortex in BIN_DIR or ~/.local/bin"
dir = "{{config_root}}"
run = "node scripts/install-dev.mjs"

[tasks.cortex]
dir = "{{config_root}}"
run = "cargo run --locked --"

[tasks.fmt]
dir = "{{config_root}}"
run = ["oxfmt .", "cargo fmt"]

[tasks.fmt-check]
dir = "{{config_root}}"
run = ["oxfmt --check .", "cargo fmt --check"]
