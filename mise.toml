[tools]
rust = { version = "1.98.1", mr_boxington = true }
mr-boxington = "1.18.0"
usage = "6.11.1"
node = "24.20.0"
"npm:oxfmt" = "0.66.0"

[tasks.build]
dir = "{{config_root}}"
run = "cargo build --locked"

[tasks.test]
dir = "{{config_root}}"
run = ["cargo test --locked", "cargo clippy --locked --all-targets -- -D warnings"]

[tasks.install]
dir = "{{config_root}}"
run = "cargo install --path . --locked --root .local"

[tasks.brain]
dir = "{{config_root}}"
run = "cargo run --locked --"

[tasks.fmt]
dir = "{{config_root}}"
run = ["oxfmt .", "cargo fmt"]

[tasks.fmt-check]
dir = "{{config_root}}"
run = ["oxfmt --check .", "cargo fmt --check"]
