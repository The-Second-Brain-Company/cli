[package]
name = "second-brain-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Second Brain CLI for people and coding agents"

[[bin]]
name = "brain"
path = "src/main.rs"

[dependencies]
usage = { package = "usage-rs", version = "=6.11.1", features = ["completions"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
reqwest = { version = "=0.13.2", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
  "form",
  "query",
] }
toml = "=1.0.3"
uuid = { version = "=1.21.0", features = ["v4"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
fs2 = "=0.4.3"
tiny_http = "=0.12.0"

[dev-dependencies]
tempfile = "=3.25.0"
